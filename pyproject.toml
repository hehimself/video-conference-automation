[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keypad-studio"
version = "0.1.0"
description = "A visual editor and companion for the Pimoroni Pico RGB Keypad"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PySide6==6.8.3", "pyserial==3.5", "PyAutoGUI==0.9.54",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "pycaw==20260927; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0", "black==25.1.0"]

[project.scripts]
keypad-studio = "keypad_studio.app:main"
keypad-firmware = "keypad_studio.install:main"

[tool.setuptools.packages.find]
include = ["keypad_studio*", "keypad_core*"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]
pythonpath = ["."]
